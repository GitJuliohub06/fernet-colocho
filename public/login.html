<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión — Fernet&Colocho</title>
  <link rel="stylesheet" href="./css/global.css" />
  <link rel="stylesheet" href="./css/auth.css" />
</head>
<body>
  <div id="app-navbar"></div>

  <main class="container auth-wrapper">
    <div class="auth-grid single-col">
      <!-- TARJETA PRINCIPAL DE LOGIN -->
      <section class="card auth-card">
        <div class="auth-header">
          <span class="badge badge-warning">ACCESO A CUENTA</span>
          <h1 class="auth-title">Bienvenido de nuevo</h1>
          <p class="auth-subtitle">Ingresa tus credenciales para acceder a tu biblioteca, carrito o panel de gestión.</p>
        </div>

        <div id="auth-alert" class="auth-alert" style="display:none;"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-identifier" class="form-label">Usuario o Correo Electrónico</label>
            <input
              type="text"
              id="login-identifier"
              class="form-control"
              placeholder="Ej. comprador, vendedor, admin o correo"
              required
            />
          </div>

          <div class="form-group">
            <label for="login-password" class="form-label">Contraseña</label>
            <input
              type="password"
              id="login-password"
              class="form-control"
              placeholder="••••••••"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary auth-submit-btn">Iniciar Sesión</button>
        </form>

        <p class="auth-switch">
          ¿Aún no tienes cuenta en Fernet&amp;Colocho?
          <a href="./register.html">Regístrate gratis aquí</a>
        </p>
      </section>
    </div>
  </main>

  <div id="app-footer"></div>

  <script type="module" src="./js/common/auth.js"></script>
</body>
</html>
